<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Recall Memory Exercise</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* ── Timer ring ── */
        .wr-timer-ring {
            position: relative;
            width: 56px; height: 56px;
            flex-shrink: 0;
        }
        .wr-timer-ring svg { transform: rotate(-90deg); }
        .wr-timer-ring circle { fill: none; stroke-width: 4; }
        .wr-timer-track { stroke: rgba(13,148,136,0.15); }
        .wr-timer-fill {
            stroke: #0d9488;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s linear;
        }

        /* ── Feedback toast ── */
        .wr-toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            padding: 14px 24px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
            z-index: 999;
            white-space: nowrap;
            pointer-events: none;
        }
        .wr-toast.show { transform: translateX(-50%) translateY(0); }
        .wr-toast.correct  { background: #d1fae5; color: #065f46; }
        .wr-toast.incorrect { background: #fee2e2; color: #991b1b; }

        /* ── Progress Tracker — teal theme ── */
        #pt-panel { pointer-events: none; }
        #pt-panel.pt-open { pointer-events: all; }

        .pt-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #pt-panel.pt-open .pt-backdrop { opacity: 1; }

        .pt-drawer {
            position: fixed;
            top: 0; right: 0; bottom: 0;
            width: min(400px, 100vw);
            background: #ffffff;
            border-left: 1px solid #99f6e4;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            box-shadow: -8px 0 40px rgba(13,148,136,0.12);
        }
        #pt-panel.pt-open .pt-drawer { transform: translateX(0); }

        .pt-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid #ccfbf1;
            flex-shrink: 0;
            background: #f0fdfa;
        }
        .pt-header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 800;
            color: #134e4a;
            font-family: inherit;
        }
        .pt-header-icon { font-size: 22px; }
        .pt-close-btn {
            background: #ccfbf1;
            border: 1px solid #99f6e4;
            color: #0d9488;
            font-size: 14px;
            width: 32px; height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
            font-family: inherit;
        }
        .pt-close-btn:hover { background: #99f6e4; color: #134e4a; }

        .pt-scroll {
            overflow-y: auto;
            flex: 1;
            padding: 20px 24px 40px;
            scrollbar-width: thin;
            scrollbar-color: #5eead4 transparent;
        }
        .pt-scroll::-webkit-scrollbar { width: 4px; }
        .pt-scroll::-webkit-scrollbar-thumb { background: #5eead4; border-radius: 4px; }

        .pt-empty { text-align: center; padding: 60px 20px; }
        .pt-empty-icon { font-size: 48px; margin-bottom: 16px; }
        .pt-empty-title { font-size: 16px; font-weight: 700; color: #0d9488; margin-bottom: 8px; }
        .pt-empty-sub { font-size: 13px; line-height: 1.6; color: #5eead4; }

        .pt-overview {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }
        .pt-pill {
            background: #f0fdfa;
            border: 1px solid #ccfbf1;
            border-radius: 14px;
            padding: 12px 8px;
            text-align: center;
        }
        .pt-pill-val { font-size: 22px; font-weight: 800; color: #0d9488; line-height: 1; margin-bottom: 4px; }
        .pt-pill-lbl { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: #5eead4; }

        .pt-section-title {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1.2px; color: #5eead4; margin: 20px 0 10px;
        }

        .pt-game-cards { display: flex; flex-direction: column; gap: 10px; }
        .pt-game-card {
            background: #f0fdfa; border: 1px solid #ccfbf1;
            border-radius: 16px; padding: 14px 16px; transition: border-color 0.2s;
        }
        .pt-game-card:hover { border-color: #5eead4; }

        .pt-game-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .pt-game-name { font-size: 14px; font-weight: 700; color: #134e4a; display: flex; align-items: center; gap: 6px; }
        .pt-mode-badge {
            font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
            background: #ccfbf1; color: #0d9488; padding: 2px 7px; border-radius: 6px; border: 1px solid #99f6e4;
        }
        .pt-trend { font-size: 20px; font-weight: 800; line-height: 1; }

        .pt-game-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
        .pt-metric { text-align: center; }
        .pt-metric-val { font-size: 16px; font-weight: 800; color: #134e4a; line-height: 1; margin-bottom: 2px; }
        .pt-metric-lbl { font-size: 10px; color: #5eead4; text-transform: uppercase; letter-spacing: 0.5px; }

        .pt-sparkline-wrap { position: relative; }
        .pt-sparkline { width: 100%; height: 36px; display: block; }
        .pt-sparkline-label { font-size: 10px; color: #99f6e4; text-align: right; margin-top: 2px; }

        .pt-history { display: flex; flex-direction: column; gap: 8px; }
        .pt-history-row {
            display: grid; grid-template-columns: 1fr auto auto auto;
            align-items: center; gap: 10px; padding: 8px 0;
            border-bottom: 1px solid #f0fdfa;
        }
        .pt-history-row:last-child { border-bottom: none; }
        .pt-history-game {
            font-size: 12px; font-weight: 600; color: #0d9488;
            display: flex; align-items: center; gap: 5px;
            min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .pt-history-score { font-size: 13px; font-weight: 800; white-space: nowrap; }
        .pt-bar-track { width: 48px; height: 4px; background: #ccfbf1; border-radius: 4px; overflow: hidden; }
        .pt-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
        .pt-history-date { font-size: 10px; color: #99f6e4; text-align: right; line-height: 1.4; white-space: nowrap; }
        .pt-history-date span { opacity: 0.7; }

        .pt-clear-btn {
            margin-top: 28px; width: 100%; background: transparent;
            border: 1px solid #fca5a5; color: #ef4444; padding: 10px;
            border-radius: 10px; font-size: 12px; font-weight: 600;
            cursor: pointer; font-family: inherit; transition: all 0.2s;
        }
        .pt-clear-btn:hover { background: #fef2f2; border-color: #f87171; }
    </style>
</head>
<body>
    <div id="root"></div>
    <div id="wr-toast" class="wr-toast"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ── Icons ─────────────────────────────────────────────────────────────
        const Brain = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
            </svg>
        );
        const RotateCcw = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
        );
        const Play = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );
        const ChartBar = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
            </svg>
        );

        // ── Progress Tracker ──────────────────────────────────────────────────
        const ProgressTracker = (() => {
            const STORAGE_KEY = 'wr_progress_v1';

            function load() {
                try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
                catch { return []; }
            }
            function save(sessions) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
            }
            function record({ game, score, max, mode = '' }) {
                if (!game || score == null || max == null) return;
                const sessions = load();
                sessions.push({ game, score, max, mode, pct: Math.round((score / max) * 100), ts: Date.now() });
                save(sessions);
                if (document.getElementById('pt-panel')?.classList.contains('pt-open')) renderPanel();
            }
            function clearAll() {
                if (confirm('Clear all progress history? This cannot be undone.')) {
                    localStorage.removeItem(STORAGE_KEY);
                    renderPanel();
                }
            }
            function computeStats(sessions) {
                if (!sessions.length) return null;
                const byGame = {};
                sessions.forEach(s => { if (!byGame[s.game]) byGame[s.game] = []; byGame[s.game].push(s); });
                const gameStats = Object.entries(byGame).map(([name, rows]) => {
                    const pcts = rows.map(r => r.pct);
                    const avg = Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length);
                    const best = Math.max(...pcts);
                    const last = rows[rows.length-1];
                    const recent = pcts.slice(-3), prior = pcts.slice(-6,-3);
                    let trend = '—';
                    if (prior.length && recent.length) {
                        const rAvg = recent.reduce((a,b)=>a+b,0)/recent.length;
                        const pAvg = prior.reduce((a,b)=>a+b,0)/prior.length;
                        trend = rAvg > pAvg+5 ? '↑' : rAvg < pAvg-5 ? '↓' : '→';
                    }
                    return { name, rows, avg, best, last, trend, count: rows.length };
                });
                const allPcts = sessions.map(s=>s.pct);
                const overallAvg = Math.round(allPcts.reduce((a,b)=>a+b,0)/allPcts.length);
                const streak = computeStreak(sessions);
                return { gameStats, overallAvg, totalSessions: sessions.length, streak };
            }
            function computeStreak(sessions) {
                if (!sessions.length) return 0;
                const days = new Set(sessions.map(s=>new Date(s.ts).toDateString()));
                let streak = 0;
                const d = new Date();
                while (days.has(d.toDateString())) { streak++; d.setDate(d.getDate()-1); }
                return streak;
            }
            function sparklinePath(values, w, h) {
                if (values.length < 2) return '';
                const xStep = w / (values.length-1);
                const pts = values.map((v,i) => `${i*xStep},${h-((v/100)*h)}`);
                return 'M'+pts.join('L');
            }
            function formatDate(ts) { return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
            function formatTime(ts) { return new Date(ts).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }

            function renderPanel() {
                const panel = document.getElementById('pt-panel');
                if (!panel) return;
                const sessions = load();
                const stats = computeStats(sessions);
                if (!stats) {
                    panel.querySelector('.pt-body').innerHTML = `
                        <div class="pt-empty">
                            <div class="pt-empty-icon">🎮</div>
                            <div class="pt-empty-title">No games played yet</div>
                            <div class="pt-empty-sub">Complete a round to start tracking your progress.</div>
                        </div>`;
                    return;
                }
                const gameCardsHtml = stats.gameStats.map(g => {
                    const sparkW=120, sparkH=36;
                    const recentPcts = g.rows.slice(-20).map(r=>r.pct);
                    const path = sparklinePath(recentPcts, sparkW, sparkH);
                    const trendColor = g.trend==='↑'?'#10b981':g.trend==='↓'?'#f87171':'#94a3b8';
                    const avgColor = g.avg>=80?'#10b981':g.avg>=50?'#f59e0b':'#f87171';
                    const modeLabel = g.last.mode ? `<span class="pt-mode-badge">${g.last.mode}</span>` : '';
                    return `
                    <div class="pt-game-card">
                        <div class="pt-game-header">
                            <div class="pt-game-name">${g.name} ${modeLabel}</div>
                            <div class="pt-trend" style="color:${trendColor}">${g.trend}</div>
                        </div>
                        <div class="pt-game-metrics">
                            <div class="pt-metric">
                                <div class="pt-metric-val" style="color:${avgColor}">${g.avg}%</div>
                                <div class="pt-metric-lbl">avg</div>
                            </div>
                            <div class="pt-metric">
                                <div class="pt-metric-val">${g.best}%</div>
                                <div class="pt-metric-lbl">best</div>
                            </div>
                            <div class="pt-metric">
                                <div class="pt-metric-val">${g.count}</div>
                                <div class="pt-metric-lbl">played</div>
                            </div>
                            <div class="pt-metric">
                                <div class="pt-metric-val">${g.last.score}/${g.last.max}</div>
                                <div class="pt-metric-lbl">last</div>
                            </div>
                        </div>
                        <div class="pt-sparkline-wrap">
                            <svg viewBox="0 0 ${sparkW} ${sparkH}" class="pt-sparkline" preserveAspectRatio="none">
                                <path d="${path}" fill="none" stroke="#0d9488" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
                                <path d="${path}L${sparkW},${sparkH}L0,${sparkH}Z" fill="url(#pt-grad)" opacity="0.18"/>
                                <defs>
                                    <linearGradient id="pt-grad" x1="0" y1="0" x2="0" y2="1">
                                        <stop offset="0%" stop-color="#0d9488"/>
                                        <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
                                    </linearGradient>
                                </defs>
                            </svg>
                            <div class="pt-sparkline-label">last ${recentPcts.length} sessions</div>
                        </div>
                    </div>`;
                }).join('');

                const recent = sessions.slice(-10).reverse();
                const historyHtml = recent.map(s => {
                    const pctColor = s.pct>=80?'#10b981':s.pct>=50?'#f59e0b':'#f87171';
                    const bar = `<div class="pt-bar-track"><div class="pt-bar-fill" style="width:${s.pct}%;background:${pctColor}"></div></div>`;
                    const modeTag = s.mode ? ` <span class="pt-mode-badge">${s.mode}</span>` : '';
                    return `
                    <div class="pt-history-row">
                        <div class="pt-history-game">${s.game}${modeTag}</div>
                        <div class="pt-history-score" style="color:${pctColor}">${s.score}/${s.max}</div>
                        ${bar}
                        <div class="pt-history-date">${formatDate(s.ts)}<br><span>${formatTime(s.ts)}</span></div>
                    </div>`;
                }).join('');

                panel.querySelector('.pt-body').innerHTML = `
                    <div class="pt-overview">
                        <div class="pt-pill"><div class="pt-pill-val">${stats.totalSessions}</div><div class="pt-pill-lbl">Total Rounds</div></div>
                        <div class="pt-pill"><div class="pt-pill-val">${stats.overallAvg}%</div><div class="pt-pill-lbl">Overall Avg</div></div>
                        <div class="pt-pill"><div class="pt-pill-val">${stats.streak}🔥</div><div class="pt-pill-lbl">Day Streak</div></div>
                    </div>
                    <div class="pt-section-title">Performance</div>
                    <div class="pt-game-cards">${gameCardsHtml}</div>
                    <div class="pt-section-title">Recent Sessions</div>
                    <div class="pt-history">${historyHtml}</div>
                    <button class="pt-clear-btn" onclick="WRProgressTracker.clearAll()">🗑 Clear all history</button>
                `;
            }

            function injectDOM() {
                if (document.getElementById('pt-panel')) return;
                const panel = document.createElement('div');
                panel.id = 'pt-panel';
                panel.innerHTML = `
                    <div class="pt-backdrop" onclick="WRProgressTracker.close()"></div>
                    <div class="pt-drawer">
                        <div class="pt-header">
                            <div class="pt-header-title"><span class="pt-header-icon">📈</span>Progress</div>
                            <button class="pt-close-btn" onclick="WRProgressTracker.close()">✕</button>
                        </div>
                        <div class="pt-body pt-scroll"></div>
                    </div>`;
                document.body.appendChild(panel);
            }

            function open() {
                injectDOM();
                renderPanel();
                requestAnimationFrame(() => document.getElementById('pt-panel').classList.add('pt-open'));
            }
            function close() {
                document.getElementById('pt-panel')?.classList.remove('pt-open');
            }

            document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

            return { record, open, close, clearAll };
        })();

        window.WRProgressTracker = ProgressTracker;

        // ── Main game ─────────────────────────────────────────────────────────
        function WordRecallGame() {
            const [gameState, setGameState] = useState('menu');
            const [wordCount, setWordCount] = useState(5);
            const [syllableLength, setSyllableLength] = useState('mixed');
            const [sequence, setSequence] = useState([]);
            const [currentRecallIndex, setCurrentRecallIndex] = useState(0);
            const [userInput, setUserInput] = useState('');
            const [userAnswers, setUserAnswers] = useState([]);
            const [score, setScore] = useState({ correct: 0, total: 0 });
            const [showStartTime, setShowStartTime] = useState(null);
            const [timerPct, setTimerPct] = useState(1); // 1 = full, 0 = empty

            const inputRef = useRef(null);
            const timerIntervalRef = useRef(null);
            const gameTimeoutRef = useRef(null);
            const toastTimerRef = useRef(null);

            const CIRCUMFERENCE = 2 * Math.PI * 24; // 150.8

            // ── Toast ──
            const showToast = (msg, type) => {
                const t = document.getElementById('wr-toast');
                if (!t) return;
                clearTimeout(toastTimerRef.current);
                t.textContent = msg;
                t.className = `wr-toast ${type} show`;
                toastTimerRef.current = setTimeout(() => t.classList.remove('show'), 1800);
            };

            // ── Word pool ──
            const wordsByLength = {
                short: [
                    'apple', 'garden', 'window', 'coffee', 'simple',
                    'banana', 'camera', 'elephant', 'bicycle', 'calendar',
                    'envelope', 'hospital', 'theater', 'library', 'monitor',
                    'November', 'officer', 'passenger', 'recipe', 'telephone',
                    'umbrella', 'vacation', 'cinema', 'detective', 'emperor',
                    'factory', 'gallery', 'harmony', 'internet', 'journalist',
                    'kangaroo', 'memory', 'octopus', 'pyramid', 'radio',
                    'satellite', 'tornado', 'universe', 'volcano', 'musical',
                    'basket', 'chicken', 'doctor', 'flower', 'laptop',
                    'market', 'oxygen', 'paper', 'robot', 'temple'
                ],
                long: [
                    'ability', 'activity', 'emergency', 'community', 'discovery',
                    'education', 'geography', 'helicopter', 'information', 'kilometers',
                    'literature', 'mathematics', 'navigator', 'operation', 'photographer',
                    'reality', 'society', 'technology', 'university', 'vocabulary',
                    'ordinary', 'particular', 'remember', 'september', 'television',
                    'understand', 'watermelon', 'calculator', 'deliveries', 'especially',
                    'competition', 'dictionary', 'electricity', 'generation', 'identification',
                    'interesting', 'necessary', 'observation', 'personality', 'refrigerator',
                    'imagination', 'communication', 'celebration', 'disappointment', 'evaluation',
                    'revolutionary', 'opportunity', 'extraordinary', 'popularity', 'architecture'
                ]
            };

            const getRandomWords = (count, lengthType) => {
                let pool = lengthType === 'mixed'
                    ? [...wordsByLength.short, ...wordsByLength.long]
                    : wordsByLength[lengthType];
                return [...pool].sort(() => Math.random() - 0.5).slice(0, count);
            };

            const getDisplayTime = (count, length) => {
                const timePerWord = length === 'short' ? 800 : 1000;
                return 2000 + (count * timePerWord);
            };

            // ── Timer ring logic ──
            const startTimerRing = (durationMs) => {
                clearInterval(timerIntervalRef.current);
                setTimerPct(1);
                const startTs = Date.now();
                timerIntervalRef.current = setInterval(() => {
                    const elapsed = Date.now() - startTs;
                    const pct = Math.max(0, 1 - elapsed / durationMs);
                    setTimerPct(pct);
                    if (pct <= 0) clearInterval(timerIntervalRef.current);
                }, 100);
            };

            const stopTimerRing = () => {
                clearInterval(timerIntervalRef.current);
            };

            // ── Game flow ──
            const launchShowing = (words, count, length) => {
                const displayTime = getDisplayTime(count, length);
                setTimerPct(1);
                startTimerRing(displayTime);
                gameTimeoutRef.current = setTimeout(() => {
                    stopTimerRing();
                    setGameState('recalling');
                }, displayTime);
            };

            const goToSetup = () => setGameState('setup');

            const startGame = () => {
                const newSequence = getRandomWords(wordCount, syllableLength);
                setSequence(newSequence);
                setCurrentRecallIndex(0);
                setUserAnswers([]);
                setScore({ correct: 0, total: 0 });
                setShowStartTime(Date.now());
                setGameState('showing');
                launchShowing(newSequence, wordCount, syllableLength);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const correctWord = sequence[currentRecallIndex];
                const userWord = userInput.trim().toLowerCase();
                const isCorrect = userWord === correctWord.toLowerCase();

                const newScore = {
                    correct: score.correct + (isCorrect ? 1 : 0),
                    total: score.total + 1
                };
                setScore(newScore);

                setUserAnswers(prev => [...prev, {
                    userAnswer: userInput.trim(),
                    correctAnswer: correctWord,
                    isCorrect,
                    position: currentRecallIndex
                }]);

                if (isCorrect) {
                    showToast('✓ Correct!', 'correct');
                } else {
                    showToast(`✗ Incorrect — word #${currentRecallIndex + 1} was "${correctWord}"`, 'incorrect');
                }

                setUserInput('');

                const delay = isCorrect ? 1000 : 2500;
                setTimeout(() => {
                    const nextIndex = currentRecallIndex + 1;
                    if (nextIndex < sequence.length) {
                        setCurrentRecallIndex(nextIndex);
                    } else {
                        ProgressTracker.record({
                            game: 'Word Recall',
                            score: newScore.correct,
                            max: newScore.total,
                            mode: `${wordCount}w ${syllableLength}`
                        });
                        setGameState('completed');
                    }
                }, delay);
            };

            const endRound = () => {
                const remainingAnswers = [];
                for (let i = currentRecallIndex; i < sequence.length; i++) {
                    remainingAnswers.push({ userAnswer: '', correctAnswer: sequence[i], isCorrect: false, position: i });
                }
                const finalAnswers = [...userAnswers, ...remainingAnswers];
                const finalScore = { correct: score.correct, total: score.correct + (score.total - score.correct) + remainingAnswers.length };
                setUserAnswers(finalAnswers);
                setScore(prev => ({ correct: prev.correct, total: prev.total + remainingAnswers.length }));
                ProgressTracker.record({
                    game: 'Word Recall',
                    score: score.correct,
                    max: sequence.length,
                    mode: `${wordCount}w ${syllableLength}`
                });
                setGameState('completed');
            };

            const resetGame = () => {
                clearTimeout(gameTimeoutRef.current);
                stopTimerRing();
                const newSequence = getRandomWords(wordCount, syllableLength);
                setSequence(newSequence);
                setCurrentRecallIndex(0);
                setUserInput('');
                setUserAnswers([]);
                setScore({ correct: 0, total: 0 });
                setShowStartTime(Date.now());
                setGameState('showing');
                launchShowing(newSequence, wordCount, syllableLength);
            };

            const handleWordCountChange = (e) => {
                const value = parseInt(e.target.value);
                if (value >= 3 && value <= 10) setWordCount(value);
            };

            const handleBackFromShowing = () => {
                clearTimeout(gameTimeoutRef.current);
                stopTimerRing();
                const elapsed = Date.now() - showStartTime;
                if (elapsed < 2000) {
                    setTimeout(() => setGameState('setup'), 2000 - elapsed);
                } else {
                    setGameState('setup');
                }
            };

            // Focus input after each recall step
            useEffect(() => {
                if (gameState === 'recalling' && inputRef.current) {
                    inputRef.current.focus();
                }
            }, [gameState, currentRecallIndex]);

            // Cleanup on unmount
            useEffect(() => {
                return () => {
                    clearTimeout(gameTimeoutRef.current);
                    clearInterval(timerIntervalRef.current);
                };
            }, []);

            const strokeOffset = CIRCUMFERENCE * (1 - timerPct);

            return (
                <div className="min-h-screen bg-gradient-to-br from-emerald-500 via-teal-500 to-cyan-500 flex items-center justify-center p-2 sm:p-4">
                    <div className="bg-white rounded-xl sm:rounded-2xl shadow-2xl p-4 sm:p-6 md:p-8 w-full max-w-full sm:max-w-md md:max-w-2xl mx-2 sm:mx-4">

                        {/* Header */}
                        <div className="flex items-center justify-center mb-4 sm:mb-6">
                            <Brain className="w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 text-teal-600 mr-2 sm:mr-3" />
                            <h1 className="text-xl sm:text-2xl md:text-3xl font-bold text-gray-800">Word Recall</h1>
                        </div>

                        {/* ── Menu ── */}
                        {gameState === 'menu' && (
                            <div className="text-center">
                                <h2 className="text-lg sm:text-xl font-semibold text-teal-600 mb-3 sm:mb-4">Train your verbal memory!</h2>
                                <div className="text-left bg-teal-50 rounded-lg p-3 sm:p-5 mb-4 sm:mb-6 text-gray-700">
                                    <p className="font-semibold mb-2 sm:mb-3 text-sm sm:text-base">How it works:</p>
                                    <ol className="space-y-1.5 sm:space-y-2 text-xs sm:text-sm">
                                        <li className="flex"><span className="font-bold text-teal-600 mr-2">1.</span><span>Choose your difficulty: number of words and word length</span></li>
                                        <li className="flex"><span className="font-bold text-teal-600 mr-2">2.</span><span>Memorize the words <strong>in order</strong></span></li>
                                        <li className="flex"><span className="font-bold text-teal-600 mr-2">3.</span><span>Type each word back <strong>one by one</strong> in the same order</span></li>
                                        <li className="flex"><span className="font-bold text-teal-600 mr-2">4.</span><span>Get immediate feedback after each entry</span></li>
                                    </ol>
                                    <div className="mt-3 sm:mt-4 p-2 sm:p-3 bg-white rounded border-2 border-teal-200">
                                        <p className="text-xs font-semibold text-teal-700 mb-1">Example:</p>
                                        <p className="text-xs sm:text-sm">See: <span className="font-semibold">camera, hospital, envelope, bicycle, umbrella</span></p>
                                        <p className="text-xs sm:text-sm mt-1">Enter: <span className="font-semibold text-green-600">camera → hospital → envelope → bicycle → umbrella</span></p>
                                    </div>
                                </div>
                                <button
                                    onClick={goToSetup}
                                    className="bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2.5 sm:py-3 px-6 sm:px-8 rounded-lg flex items-center justify-center mx-auto transition-colors shadow-lg text-sm sm:text-base"
                                >
                                    <Play className="w-4 h-4 sm:w-5 sm:h-5 mr-2" />
                                    Start Exercise
                                </button>
                            </div>
                        )}

                        {/* ── Setup ── */}
                        {gameState === 'setup' && (
                            <div className="text-center">
                                <h2 className="text-lg sm:text-xl font-semibold text-teal-600 mb-4 sm:mb-6">Choose Your Challenge</h2>
                                <div className="bg-teal-50 rounded-lg p-3 sm:p-6 mb-3 sm:mb-4">
                                    <label className="block text-gray-700 font-semibold mb-2 sm:mb-3 text-sm sm:text-base">How many words?</label>
                                    <div className="flex items-center justify-center gap-3 sm:gap-4 mb-3 sm:mb-4">
                                        <input
                                            type="number" min="3" max="10" value={wordCount}
                                            onChange={handleWordCountChange}
                                            className="w-16 sm:w-24 text-2xl sm:text-3xl text-center border-2 border-teal-300 rounded-lg p-2 sm:p-3 focus:outline-none focus:border-teal-600"
                                        />
                                        <span className="text-gray-600 text-sm sm:text-base">words</span>
                                    </div>
                                    <input
                                        type="range" min="3" max="10" value={wordCount}
                                        onChange={handleWordCountChange}
                                        className="w-full h-2 bg-teal-200 rounded-lg appearance-none cursor-pointer"
                                        style={{ background: `linear-gradient(to right, #0d9488 0%, #0d9488 ${((wordCount-3)/7)*100}%, #ccfbf1 ${((wordCount-3)/7)*100}%, #ccfbf1 100%)` }}
                                    />
                                    <div className="flex justify-between text-xs text-gray-500 mt-2">
                                        <span>3 (Easier)</span><span>10 (Harder)</span>
                                    </div>
                                </div>
                                <div className="bg-teal-50 rounded-lg p-3 sm:p-6 mb-4 sm:mb-6">
                                    <label className="block text-gray-700 font-semibold mb-2 sm:mb-3 text-sm sm:text-base">Word length (syllables)</label>
                                    <div className="grid grid-cols-3 gap-2 sm:gap-3">
                                        {['short','mixed','long'].map(type => (
                                            <button key={type} onClick={() => setSyllableLength(type)}
                                                className={`py-2 sm:py-3 px-2 sm:px-4 rounded-lg font-semibold transition-all text-xs sm:text-sm ${syllableLength === type ? 'bg-teal-600 text-white shadow-lg' : 'bg-white text-gray-700 border-2 border-teal-200 hover:border-teal-400'}`}>
                                                <div className="text-xs sm:text-sm capitalize">{type}</div>
                                                <div className="text-[10px] sm:text-xs opacity-75">{type==='short'?'2-3 syl':type==='mixed'?'2-5 syl':'4-5 syl'}</div>
                                            </button>
                                        ))}
                                    </div>
                                    <div className="mt-3 sm:mt-4 text-xs sm:text-sm text-gray-600">
                                        <p>Display time: <strong>{(getDisplayTime(wordCount, syllableLength)/1000).toFixed(1)}s</strong></p>
                                        <p className="text-xs mt-1 italic">
                                            {syllableLength === 'short' && 'Short words like: apple, camera, bicycle'}
                                            {syllableLength === 'mixed' && 'Mixed words: camera, technology, window'}
                                            {syllableLength === 'long' && 'Long words like: university, refrigerator, extraordinary'}
                                        </p>
                                    </div>
                                </div>
                                <div className="flex gap-3 justify-center">
                                    <button onClick={() => setGameState('menu')}
                                        className="bg-gray-300 hover:bg-gray-400 text-gray-700 font-semibold py-3 px-6 rounded-lg transition-colors">
                                        View Instructions
                                    </button>
                                    <button onClick={startGame}
                                        className="bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3 px-8 rounded-lg flex items-center transition-colors shadow-lg">
                                        <Play className="w-5 h-5 mr-2" />
                                        Begin
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* ── Showing (memorize) ── */}
                        {gameState === 'showing' && (
                            <div>
                                <div className="flex items-center justify-between mb-3 sm:mb-4">
                                    <button onClick={handleBackFromShowing}
                                        className="bg-gray-300 hover:bg-gray-400 text-gray-700 font-semibold py-1.5 sm:py-2 px-3 sm:px-4 rounded-lg transition-colors text-xs sm:text-sm">
                                        Back
                                    </button>
                                    <div className="text-xs sm:text-sm text-gray-600">Memorize these words...</div>
                                    {/* Timer ring — top right */}
                                    <div className="wr-timer-ring">
                                        <svg width="56" height="56" viewBox="0 0 56 56">
                                            <circle className="wr-timer-track" cx="28" cy="28" r="24"/>
                                            <circle
                                                className="wr-timer-fill"
                                                cx="28" cy="28" r="24"
                                                strokeDasharray={CIRCUMFERENCE}
                                                strokeDashoffset={strokeOffset}
                                            />
                                        </svg>
                                    </div>
                                </div>
                                <div className="bg-gradient-to-r from-teal-100 to-cyan-100 rounded-xl p-4 sm:p-6 md:p-8">
                                    <div className="space-y-2 sm:space-y-3">
                                        {sequence.map((word, index) => (
                                            <div key={index} className="flex items-center gap-2 sm:gap-3 md:gap-4">
                                                <div className="w-8 h-8 sm:w-9 sm:h-9 md:w-10 md:h-10 bg-teal-600 text-white rounded-full flex items-center justify-center font-bold text-sm sm:text-base md:text-lg flex-shrink-0">
                                                    {index + 1}
                                                </div>
                                                <div className="flex-1 bg-white rounded-lg shadow-lg p-2 sm:p-3 md:p-4 text-lg sm:text-xl md:text-2xl font-semibold text-teal-700 text-center">
                                                    {word}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ── Recalling ── */}
                        {gameState === 'recalling' && (
                            <div>
                                <div className="text-center mb-4 sm:mb-6">
                                    <div className="text-xs sm:text-sm text-gray-500 mb-1 sm:mb-2">Word {currentRecallIndex+1} of {sequence.length}</div>
                                    <div className="text-base sm:text-lg font-semibold text-teal-600 mb-1 sm:mb-2">Enter word #{currentRecallIndex+1}</div>
                                    <div className="text-xs sm:text-sm text-gray-500">Score: {score.correct} / {score.total}</div>
                                </div>
                                <div className="bg-gray-50 rounded-xl p-3 sm:p-4 md:p-6 mb-3 sm:mb-4">
                                    <div className="space-y-1.5 sm:space-y-2 mb-4 sm:mb-6">
                                        {sequence.map((word, index) => {
                                            const isCurrentTarget = index === currentRecallIndex;
                                            const answer = userAnswers.find(a => a.position === index);
                                            return (
                                                <div key={index} className="flex items-center gap-2 sm:gap-3">
                                                    <div className={`w-8 h-8 sm:w-9 sm:h-9 md:w-10 md:h-10 rounded-full flex items-center justify-center font-bold text-sm sm:text-base md:text-lg flex-shrink-0 ${
                                                        isCurrentTarget ? 'bg-teal-600 text-white animate-pulse'
                                                        : answer ? answer.isCorrect ? 'bg-green-500 text-white' : 'bg-red-500 text-white'
                                                        : 'bg-gray-300 text-gray-600'
                                                    }`}>
                                                        {answer ? (answer.isCorrect ? '✓' : '✗') : index+1}
                                                    </div>
                                                    <div className={`flex-1 rounded-lg p-2 sm:p-3 text-center font-semibold border-2 text-sm sm:text-base ${
                                                        isCurrentTarget ? 'bg-teal-50 border-teal-400 border-dashed'
                                                        : answer ? answer.isCorrect ? 'bg-green-50 border-green-400' : 'bg-red-50 border-red-400'
                                                        : 'bg-gray-100 border-gray-300'
                                                    }`}>
                                                        {answer ? answer.userAnswer : isCurrentTarget ? '?' : '???'}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                    <form onSubmit={handleSubmit}>
                                        <input
                                            ref={inputRef}
                                            type="text"
                                            value={userInput}
                                            onChange={(e) => setUserInput(e.target.value)}
                                            className="w-full text-xl sm:text-2xl text-center border-2 border-teal-300 rounded-lg p-3 sm:p-4 focus:outline-none focus:border-teal-600"
                                            autoFocus required placeholder="Type the word..."
                                        />
                                        <div className="flex gap-2 sm:gap-3 mt-3 sm:mt-4">
                                            <button type="button" onClick={endRound}
                                                className="flex-1 bg-gray-400 hover:bg-gray-500 text-white font-semibold py-2.5 sm:py-3 rounded-lg transition-colors text-sm sm:text-base">
                                                End Round
                                            </button>
                                            <button type="submit"
                                                className="flex-1 bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2.5 sm:py-3 rounded-lg transition-colors text-sm sm:text-base">
                                                Submit
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* ── Completed ── */}
                        {gameState === 'completed' && (
                            <div className="text-center">
                                <h2 className="text-xl sm:text-2xl font-bold text-gray-800 mb-3 sm:mb-4">Round Complete!</h2>
                                <div className="bg-gradient-to-r from-teal-100 to-cyan-100 rounded-xl p-4 sm:p-6 mb-4 sm:mb-6">
                                    <div className="text-4xl sm:text-5xl font-bold text-teal-600 mb-2">
                                        {score.correct} / {score.total}
                                    </div>
                                    <div className="text-gray-700 mb-3 sm:mb-4 text-sm sm:text-base">
                                        {Math.round((score.correct / score.total) * 100)}% accuracy
                                    </div>
                                    <div className="mt-3 sm:mt-4 pt-3 sm:pt-4 border-t border-teal-200">
                                        <div className="text-xs sm:text-sm text-gray-600 mb-2 sm:mb-3">Review:</div>
                                        <div className="space-y-1.5 sm:space-y-2">
                                            {sequence.map((word, index) => {
                                                const answer = userAnswers[index];
                                                if (!answer) return null;
                                                return (
                                                    <div key={index} className="flex items-center gap-2 sm:gap-3">
                                                        <div className={`w-6 h-6 sm:w-8 sm:h-8 rounded-full flex items-center justify-center text-xs sm:text-sm font-bold flex-shrink-0 ${answer.isCorrect ? 'bg-green-500 text-white' : 'bg-red-500 text-white'}`}>
                                                            {answer.isCorrect ? '✓' : '✗'}
                                                        </div>
                                                        <div className="flex-1 text-left">
                                                            {!answer.isCorrect && answer.userAnswer && (
                                                                <div className="text-xs sm:text-sm text-red-600 line-through">{answer.userAnswer}</div>
                                                            )}
                                                            <div className={`font-semibold text-sm sm:text-base ${answer.isCorrect ? 'text-green-700' : 'text-teal-700'}`}>{word}</div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                                {/* Action buttons */}
                                <div className="flex gap-3 justify-center">
                                    <button onClick={resetGame}
                                        className="bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2.5 sm:py-3 px-5 sm:px-6 rounded-lg flex items-center justify-center transition-colors text-sm sm:text-base">
                                        <RotateCcw className="w-4 h-4 sm:w-5 sm:h-5 mr-2" />
                                        New Round
                                    </button>
                                    <button onClick={() => ProgressTracker.open()}
                                        className="bg-white hover:bg-teal-50 text-teal-600 font-semibold py-2.5 sm:py-3 px-5 sm:px-6 rounded-lg flex items-center justify-center transition-colors text-sm sm:text-base border-2 border-teal-300 hover:border-teal-400">
                                        <ChartBar className="w-4 h-4 sm:w-5 sm:h-5 mr-2" />
                                        Stats
                                    </button>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        ReactDOM.render(<WordRecallGame />, document.getElementById('root'));
    </script>
</body>
</html>
